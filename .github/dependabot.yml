version: 2

updates:
  # pnpm workspaces（ルートの pnpm-workspace.yaml の catalog を含む）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    # 公開直後の版は取り込まない（サプライチェーン対策）
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # vite は vite-plus-core の別名なので vite-plus と同時に上げる
      vite-plus:
        patterns:
          - vite-plus
          - vite
          - "@voidzero-dev/*"
          - "@vitejs/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
