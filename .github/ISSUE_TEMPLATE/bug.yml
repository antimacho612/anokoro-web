name: 不具合の報告
description: 動かない、表示が崩れる、思った動きと違う、などを知らせる
title: "[不具合] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        書いた HTML を貼る場合は、個人情報が含まれていないか確かめてください。
  - type: input
    id: year
    attributes:
      label: 年
      placeholder: "2005"
    validations:
      required: true
  - type: input
    id: screen
    attributes:
      label: 画面
      description: 作成キット、時代まちがいさがし、サイトの表示など
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 手順
      description: 不具合が起きるまでの操作
      placeholder: |
        1. 年を 2005 にする
        2. パーツ箱から「カウンター」を入れる
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動き
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動き
      description: スクリーンショットがあれば貼ってください
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: ブラウザと OS
      placeholder: 例：Chrome 142 / Windows 11
    validations:
      required: false
